plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.googletagmanager'
version = '0.1.0'

android {
  namespace "expo.modules.googletagmanager"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  api "com.google.android.gms:play-services-tagmanager:18.3.0"
}
